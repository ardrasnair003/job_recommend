<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job posts</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f2f2f2;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
    }

    .button-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-add {
      background-color: #4CAF50;
      color: white;
    }

    .btn-back {
      background-color: #555;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ddd;
      text-align: center;
      padding: 8px;
    }

    th {
      background-color: #f4f4f4;
    }

    .btn-edit {
      background-color: #2196F3;
      color: white;
    }

    .btn-delete {
      background-color: #f44336;
      color: white;
    }

    @media (max-width: 600px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }

      tr {
        margin-bottom: 15px;
      }

      td {
        text-align: right;
        position: relative;
        padding-left: 50%;
      }

      td::before {
        content: attr(data-label);
        position: absolute;
        left: 0;
        width: 50%;
        padding-left: 15px;
        font-weight: bold;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Job posts</h2>

    <div class="button-bar">
      <button class="btn-back" onclick="location.href='{% url 'recruiter_home' %}'">Back</button>
      <button class="btn-add" onclick="location.href='{% url 'add_job_recr' %}'">Add</button>
    </div>

      {% if gtg %}

    <table id="dataTable">
      <thead>
        <tr>
          <th>Designation</th>
          <th>City</th>
          <th>Age range</th>
          <th>Skills</th>
          <th>Number of vacancies</th>
        </tr>
      </thead>
      <tbody>

      {% for e in gtg %}
        <tr>
          <td data-label="Item Name">{{e.designation}}</td>
          <td data-label="Item Name">{{e.city}}</td>
          <td data-label="Item Name">{{e.age_range}}</td>
          <td data-label="Item Name">{{e.skills_needed}}</td>
          <td data-label="Item Name">{{e.number_of_vacancies}}</td>
          <td data-label="Actions">
            <button class="btn-edit" onclick="location.href='{% url 'edit_job_recr' e.id %}'">Edit</button>
            <button class="btn btn-danger" onclick="if(confirm('Are you sure you want to delete this job?')) { location.href='{% url 'delete_job_recr' e.id %}'; }">
              <i class="fas fa-trash-alt me-1"></i> Delete
          </button>

          </td>
        </tr>
      {% endfor %}

      </tbody>
    </table>

      {% else %}
      <h1 align="center">No jobs added</h1>
      {% endif %}

  </div>

  <script>
    function addRow() {
      const table = document.getElementById("dataTable").getElementsByTagName('tbody')[0];
      const rowCount = table.rows.length + 1;
      const row = table.insertRow();

      row.innerHTML = `
        <td data-label="#">${rowCount}</td>
        <td data-label="Item Name">New Item</td>
        <td data-label="Quantity">0</td>
        <td data-label="Actions">
          <button class="btn-edit" onclick="editRow(this)">Edit</button>
          <button class="btn-delete" onclick="deleteRow(this)">Delete</button>
        </td>
      `;
    }

    function deleteRow(btn) {
      const row = btn.parentNode.parentNode;
      row.parentNode.removeChild(row);
    }

    function editRow(btn) {
      const row = btn.parentNode.parentNode;
      const nameCell = row.cells[1];
      const qtyCell = row.cells[2];
      const newName = prompt("Enter new item name:", nameCell.textContent);
      const newQty = prompt("Enter new quantity:", qtyCell.textContent);
      if (newName !== null) nameCell.textContent = newName;
      if (newQty !== null) qtyCell.textContent = newQty;
    }
  </script>


<script>
       {% if messages %}
       {% for msg in messages %}
               alert("{{ msg }}");
       {% endfor %}
   {% endif %}
</script>



</body>
</html>
