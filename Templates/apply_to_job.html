<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Apply to Job</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome (for icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>

    <style>
        body {
            background-color: #f0f2f5;
        }
        .form-container {
            max-width: 600px;
            margin: 60px auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }
        .form-title {
            text-align: center;
            color: #007bff;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container">
        <h2 class="form-title"><i class="fas fa-paper-plane me-2"></i>Apply to Job</h2>

        <form method="post" action="{% url 'apply_to_job' job.id %}" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label for="resume" class="form-label">Upload Resume (PDF/DOC)</label>
                <input type="file" id="resume" class="form-control" name="resume" accept=".pdf,.doc,.docx" required>
            </div>

            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane me-1"></i> Submit Application
                </button>

                <a href="{% url 'predict_job_usr2' %}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left me-1"></i> Back
                </a>

            </div>

        </form>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Display messages -->
<script>
    {% if messages %}
        {% for msg in messages %}
            alert("{{ msg }}");
        {% endfor %}
    {% endif %}
</script>

</body>
</html>
