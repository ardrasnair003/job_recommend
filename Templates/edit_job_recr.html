<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Job</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .form-container {
            max-width: 700px;
            margin: 50px auto;
            background-color: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .form-title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #007bff;
        }

        label {
            font-weight: 500;
            margin-bottom: 6px;
        }

        .form-control {
            border-radius: 8px;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-custom {
            width: 100%;
        }

        @media (min-width: 576px) {
            .btn-custom {
                width: auto;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container">
        <h2 class="form-title"><i class="fas fa-edit me-2"></i>Edit Job</h2>

        <form method="post" action="{% url 'edit_job_recr' jb.id %}" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label for="desg">Designation</label>
                <input type="text" class="form-control" id="desg" name="desg" value="{{ jb.designation }}" required>
            </div>

            <div class="mb-3">
                <label for="city">City</label>
                <input type="text" class="form-control" id="city" name="city" value="{{ jb.city }}" required>
            </div>

            <div class="mb-3">
                <label for="a_r">Age Range</label>
                <input type="text" class="form-control" id="a_r" name="a_r" value="{{ jb.age_range }}" required>
            </div>

             <div class="mb-3">
                <label for="n_o_v">Number of vacancies</label>
                <input type="number" class="form-control" id="n_o_v" name="n_o_v" value="{{ jb.number_of_vacancies }}" required>
            </div>

            <div class="mb-3">
                <label for="skills">Skills Needed</label>
                <textarea class="form-control" id="skills" name="skills" rows="4" required>{{ jb.skills_needed }}</textarea>
            </div>

            <div class="btn-group mt-4">
                <button type="submit" class="btn btn-success btn-custom">
                    <i class="fas fa-save me-1"></i> Save
                </button>
                <button type="reset" class="btn btn-warning btn-custom">
                    <i class="fas fa-undo me-1"></i> Reset
                </button>
                <button type="button" class="btn btn-secondary btn-custom" onclick="location.href='{% url 'job_posts_recr' %}'">
                    <i class="fas fa-arrow-left me-1"></i> Back
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Optional JS for message alerts -->
<script>
    {% if messages %}
        {% for msg in messages %}
            alert("{{ msg }}");
        {% endfor %}
    {% endif %}
</script>

</body>
</html>
